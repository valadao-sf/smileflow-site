<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400 800;font-display:swap;src:url(/simulador-objecoes/assets/fonts/inter-normal.woff2) format('woff2')}

<body>
<main>
  <div class="who"><img src="/simulador-objecoes/assets/share-nath-roxo.webp" alt="Nathálya Mello" width="56" height="56"><p><b>Masterclass ao vivo</b>com Nathálya Mello · @nathmellop</p></div>
  <h1>Destrave as <em>objeções</em></h1>
  <p class="meta"><span id="mc-date">Ter, 10/nov</span><i></i><span>19h30</span><i></i><s>R$ 129</s><strong>Grátis</strong></p>
  <span class="tag">Últimas vagas gratuitas</span>
  <form id="mc-form" novalidate>
    <input type="text" id="mc-name" autocomplete="name" maxlength="80" placeholder="Seu nome" aria-label="Seu nome">
    <input type="tel" id="mc-phone" autocomplete="tel-national" inputmode="tel" maxlength="20" placeholder="WhatsApp com DDD" aria-label="WhatsApp com DDD">
    <button class="btn" type="submit" id="mc-go" aria-disabled="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.7-.3-1.5-.7-2.2-1.4-.6-.5-1-1.2-1.2-1.6-.1-.2 0-.4.1-.5l.4-.5.3-.4v-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4.1 1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg><span id="mc-label">Entrar no grupo VIP</span></button>
    <p class="err" id="mc-err" role="alert"></p>
    <p class="fine" id="mc-consent">Ao entrar, aceito receber mensagens da equipe da Nathálya Mello pelo WhatsApp. Posso pedir para sair quando quiser.</p>
  </form>
</main>
<script>
(() => {
  // Turmas: vale a próxima; passou do horário de uma, vale a seguinte; depois da última, fica a última.
  // group: link do grupo de WhatsApp de cada turma.
  const SESSIONS = [
    { id: '2026-11-10', at: '2026-11-10T19:30:00-03:00', group: 'https://chat.whatsapp.com/IeDl8CI4m8q4SoWUVqC9Z4?mode=gi_t' },
    { id: '2026-11-17', at: '2026-11-17T19:30:00-03:00', group: 'https://chat.whatsapp.com/EqsnD6mE1feGkvXAkD5R0q?mode=gi_t' },
    { id: '2026-11-24', at: '2026-11-24T19:30:00-03:00', group: 'https://chat.whatsapp.com/BkH8yILtwBA7YZiEmWycVx?mode=gi_t' },
  ];
  const WEBHOOK = 'https://n8n.smileflow.me/webhook/simulador-objecoes';
  const FORM = { id: 'masterclass_objecoes_v1', version: '1.1.0' };
  const KEY = 'nath_masterclass', PERFIL_KEY = 'nath_perfil';
  const $ = s => document.querySelector(s);
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const now = Date.now();
  const sess = SESSIONS.find(s => now < Date.parse(s.at)) || SESSIONS[SESSIONS.length - 1];
  const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const [, mm, dd] = sess.id.split('-').map(Number);
  $('#mc-date').textContent = `Ter, ${dd}/${MES[mm - 1]}`;

  const DDDS = '11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99'.split(' ');
  const phoneOk = d => {
    if (!/^\d{10,11}$/.test(d) || !DDDS.includes(d.slice(0, 2))) return false;
    const n = d.slice(2);
    if (/^(\d)\1+$/.test(n)) return false;
    return n.length === 9 ? n[0] === '9' : /^[2-9]/.test(n);
  };
  const IS_TEST = (() => {
    try { if (new URLSearchParams(location.search).get('teste') === '1') return true; } catch (e) {}
    try { if (sessionStorage.getItem('sf_test')) return true; } catch (e) {}
    return !/(^|\.)smileflow\.com\.br$/.test(location.hostname);
  })();
  const uuid = () => { try { return crypto.randomUUID(); } catch (e) { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); } };
  const attr = () => { try { return window.sfTrack && window.sfTrack.attribution ? { ...window.sfTrack.attribution(), ids: window.sfTrack.ids() } : null; } catch (e) { return null; } };
  const utm = () => { const o = {}; try { const q = new URLSearchParams(location.search);
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'fbclid'].forEach(k => { if (q.get(k)) o[k] = q.get(k).slice(0, 200); }); } catch (e) {} return o; };

  const nameEl = $('#mc-name'), phoneEl = $('#mc-phone'), go = $('#mc-go'), err = $('#mc-err');
  const vals = () => ({ name: nameEl.value.replace(/\s+/g, ' ').trim(), dg: phoneEl.value.replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '') });
  const ready = () => { const v = vals(); return v.name.length >= 2 && phoneOk(v.dg); };
  const sync = () => { go.setAttribute('aria-disabled', ready() ? 'false' : 'true'); if (ready()) err.textContent = ''; };
  nameEl.addEventListener('input', sync); phoneEl.addEventListener('input', sync);

  const prev = store.get(PERFIL_KEY);
  if (prev && prev.name) nameEl.value = prev.name;
  if (prev && prev.phone) { const d = String(prev.phone).replace(/^55/, ''); phoneEl.value = d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d; }
  sync();

  let sent = '';
  $('#mc-form').addEventListener('submit', e => {
    e.preventDefault();
    const { name, dg } = vals();
    if (name.length < 2) { err.textContent = 'Escreva o seu nome.'; nameEl.focus(); return; }
    if (!phoneOk(dg)) { err.textContent = 'Confira o WhatsApp: DDD e 8 ou 9 dígitos.'; phoneEl.focus(); return; }
    const key = sess.id + ':' + dg;
    if (sent !== key) {
      sent = key;
      const id = uuid();
      const body = JSON.stringify({ event_id: id, type: 'masterclass', form_id: FORM.id, form_version: FORM.version, audience_type: 'lead', is_test: IS_TEST,
        page: location.pathname, source: 'masterclass-objecoes', session: sess.id, name, phone: '55' + dg, consent: true, consent_text: $('#mc-consent').textContent,
        where: 'masterclass', first_contact: true, utm: utm(), attribution: attr(), ts: new Date().toISOString() });
      try {
        const cors = /(^|\.)smileflow\.com\.br$/.test(location.hostname);
        fetch(WEBHOOK, { method: 'POST', mode: cors ? 'cors' : 'no-cors', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body, keepalive: true })
          .catch(() => { try { navigator.sendBeacon(WEBHOOK, new Blob([body], { type: 'text/plain;charset=UTF-8' })); } catch (e3) {} });
      } catch (e1) {}
      try { window.sfTrack('pedido_contato', { where: 'masterclass', session: sess.id, has_whatsapp: true }, { eventId: id }); } catch (e) {}
      store.set(KEY, { session: sess.id, name, at: Date.now() });
      const p = store.get(PERFIL_KEY) || {}; store.set(PERFIL_KEY, { ...p, name: p.name || name, phone: '55' + dg });
    }
    // O envio usa keepalive/beacon, então segue mesmo saindo da página. O grupo abre na mesma aba (no celular, vai direto ao WhatsApp).
    if (!sess.group) { $('#mc-label').textContent = 'Vaga garantida · link do grupo em breve'; return; }
    $('#mc-label').textContent = 'Abrindo o grupo…';
    setTimeout(() => { location.assign(sess.group); }, 180);
  });
})();
</script>
</body>
